<!-- sticky top nav; on mobile the hamburger <button> toggles the menu (aria-expanded) -->
<a class="skip-link" href="#main">דלג לתוכן הראשי</a>
<header class="nav-bar" role="banner">
  <div class="nav-inner">
    <div class="nav-brand-wrap">
      <a class="nav-brand" href="/" aria-label="דף הבית">
        <img src="/logo.jpg" alt="" width="32" height="32" aria-hidden="true">
        <span>התראות פיקוד העורף</span>
      </a>
      <span class="nav-endorsement" title="יוזמה עצמאית מבית Bersaglio">מבית Bersaglio</span>
    </div>
    <button type="button" class="nav-hamburger" aria-label="פתח תפריט" aria-expanded="false" aria-controls="nav-menu">
      <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
    </button>
    <nav class="nav-links" id="nav-menu" aria-label="ניווט ראשי">
      <a href="/" data-slug="/">בית</a>
      <a href="/guides/" data-slug="/guides/">מדריכים</a>
      <a href="/faq/" data-slug="/faq/">שאלות</a>
      <a href="/changelog/" data-slug="/changelog/">שינויים</a>
      <a href="https://github.com/yonatan2021/pikud-haoref-bot" rel="noopener" target="_blank">GitHub</a>
      <button class="nav-theme-toggle" aria-label="החלף בין מצב בהיר לכהה" type="button" data-theme-toggle>🌓</button>
      <kbd class="nav-palette-hint" title="פתח פלטה מהירה">/</kbd>
    </nav>
  </div>
</header>
<script>
  // highlight active route — runs before main scripts
  (function(){
    var active = '{{ACTIVE_SLUG}}' || (location.pathname.endsWith('/') ? location.pathname : location.pathname + '/');
    document.querySelectorAll('.nav-links a[data-slug]').forEach(function(a){
      if (a.dataset.slug === active) { a.setAttribute('aria-current','page'); a.classList.add('is-active'); }
    });
  })();

  // mobile menu: closed menu is inert (not focusable), Esc closes and returns focus
  (function(){
    var btn = document.querySelector('.nav-hamburger');
    var menu = document.getElementById('nav-menu');
    if (!btn || !menu) return;
    var mobile = window.matchMedia ? window.matchMedia('(max-width: 900px)') : null;
    function isMobile() { return mobile ? mobile.matches : false; }
    function sync() {
      var open = btn.getAttribute('aria-expanded') === 'true';
      if (isMobile() && !open) menu.setAttribute('inert', '');
      else menu.removeAttribute('inert');
    }
    function setOpen(open) {
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      sync();
    }
    btn.addEventListener('click', function(){
      setOpen(btn.getAttribute('aria-expanded') !== 'true');
    });
    document.addEventListener('keydown', function(e){
      if (e.key === 'Escape' && btn.getAttribute('aria-expanded') === 'true') {
        setOpen(false);
        btn.focus();
      }
    });
    if (mobile) {
      var onChange = function(){ if (!isMobile()) btn.setAttribute('aria-expanded', 'false'); sync(); };
      if (mobile.addEventListener) mobile.addEventListener('change', onChange);
      else if (mobile.addListener) mobile.addListener(onChange);
    }
    sync();
  })();
</script>
